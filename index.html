<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eccece">
  <title>Varjúpletyka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- data-state: intro | listening | active | error -->
  <main id="app" data-state="intro">

    <!-- Crow heads and message bubbles are added by app.js (one per corner, max 4) -->

    <!-- Ear (centered) + AirPod (only visible in the intro) -->
    <button id="ear" class="ear" type="button" aria-label="Koppints ide, és hallgasd a varjakat">
      <img class="ear-img" src="assets/ear.svg" alt="">
      <img class="airpod" src="assets/airpod.svg" alt="">
      <!-- Figma layers above the AirPod (Intersect, Vector 3): the AirPod sits between them and Vector 4 -->
      <img class="ear-front front-intersect" src="assets/ear-intersect.svg" alt="">
      <img class="ear-front front-v3" src="assets/ear-v3.svg" alt="">
    </button>

    <!-- Error text (monospace) -->
    <p id="error" class="error" role="status"></p>
  </main>

  <script src="lib/tf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
